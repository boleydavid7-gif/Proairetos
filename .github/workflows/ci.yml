name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Forest and reference AVIF files
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          file src/assets/backgrounds/{dawn,night,forest}-dark-mobile.avif
          for image in src/assets/backgrounds/{dawn,night,forest}-dark-mobile.avif; do
            echo "--- $image"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 "$image"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cap:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Dates and times must hold wherever the person is, not just in UTC.
      - run: TZ=Pacific/Auckland npm test
      - run: TZ=America/Los_Angeles npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
