name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Dates and times must hold wherever the person is, not just in UTC.
      - run: TZ=Pacific/Auckland npm test
      - run: TZ=America/Los_Angeles npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
