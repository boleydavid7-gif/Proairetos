name: Generate Proairetos install icons

on:
  push:
    branches:
      - brand/proairetos-mark-v2
    paths:
      - public/icons/icon.svg
      - .github/workflows/generate-proairetos-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/proairetos-mark-v2
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate iOS and PWA PNG icons
        run: |
          rsvg-convert -w 180 -h 180 public/icons/icon.svg > public/icons/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 public/icons/icon.svg > public/icons/icon-192.png
          rsvg-convert -w 512 -h 512 public/icons/icon.svg > public/icons/icon-512.png
          rsvg-convert -w 512 -h 512 public/icons/icon.svg > public/icons/icon-maskable-512.png
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Proairetos iOS and PWA app icons"
            git push origin HEAD:brand/proairetos-mark-v2
          fi
