<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="philia-tile" x1="1" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#dc7461"/><stop offset="1" stop-color="#ba5644"/></linearGradient>
    <radialGradient id="philia-light" cx="770" cy="170" r="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f7d5bb" stop-opacity="0.42"/><stop offset=".28" stop-color="#f7d5bb" stop-opacity="0.1596"/><stop offset="1" stop-color="#f7d5bb" stop-opacity="0"/></radialGradient>
    <filter id="philia-lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="-10" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/></filter>
