      <circle cx="620" cy="512" r="216" fill="#edb9b0"/>
      <circle cx="404" cy="512" r="216" fill="#fbf6ec"/>
      <circle cx="620" cy="512" r="216" fill="#d7988d" clip-path="url(#philia-left)"/></g></g>
</svg>
